<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0c0a09; color: #fafaf9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-container { width: 100%; max-width: 420px; padding: 20px; }
    .login-card { background: #1c1917; border: 1px solid #292524; border-radius: 20px; padding: 40px 32px; }
    .login-card .icon { text-align: center; font-size: 3rem; margin-bottom: 16px; }
    .login-card h1 { font-size: 1.5rem; font-weight: 600; text-align: center; margin-bottom: 8px; }
    .login-card .subtitle { text-align: center; color: #78716c; font-size: .9rem; margin-bottom: 32px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: .85rem; color: #a8a29e; margin-bottom: 8px; }
    .form-group input, .form-group select { width: 100%; padding: 14px 16px; background: #0c0a09; border: 1px solid #292524; border-radius: 12px; color: #fafaf9; font-size: 1rem; font-family: 'Inter', sans-serif; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #fbbf24; }
    .form-group select option { background: #1c1917; color: #fafaf9; }
    .btn-login { width: 100%; padding: 14px; background: #fbbf24; color: #0c0a09; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: .2s; }
    .btn-login:hover { background: #f59e0b; }
    .error { background: #450a0a; border: 1px solid #7f1d1d; color: #fca5a5; padding: 12px 16px; border-radius: 10px; font-size: .85rem; margin-bottom: 20px; display: none; }
    .error.show { display: block; }
    .links { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
    .links a { color: #78716c; text-decoration: none; font-size: .85rem; transition: .2s; }
    .links a:hover { color: #fbbf24; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="icon">🔒</div>
      <h1 id="pageTitle">Acceso Admin</h1>
      <p class="subtitle" id="pageSubtitle">Seleccione sucursal e ingrese su contrasena</p>
      <div class="error" id="errorMsg">Contrasena incorrecta. Intente de nuevo.</div>
      <div class="form-group">
        <label>Sucursal</label>
        <select id="locationSelect" onchange="onLocationChange()">
          <option value="cubacuba">Snack Bar Cuba Cuba</option>
          <option value="ranchon">Bar Ranchon Santa Clara</option>
        </select>
      </div>
      <div class="form-group">
        <label>Contrasena</label>
        <input type="password" id="passwordInput" placeholder="Ingrese su contrasena" autofocus>
      </div>
      <button class="btn-login" onclick="login()">Entrar</button>
      <div class="links">
        <a href="menu.html">&larr; Menu</a>
        <a href="index.html">Inicio</a>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const savedLoc = localStorage.getItem('location') || 'cubacuba';
    document.getElementById('locationSelect').value = savedLoc;

    function onLocationChange() {
      const loc = document.getElementById('locationSelect').value;
      localStorage.setItem('location', loc);
    }

    function login() {
      const locId = document.getElementById('locationSelect').value;
      const loc = LOCATIONS[locId];
      const password = document.getElementById('passwordInput').value;
      if (password === loc.password) {
        setLocation(locId);
        sessionStorage.setItem('adminAuth', 'true');
        window.location.href = 'admin.html';
      } else {
        document.getElementById('errorMsg').classList.add('show');
        document.getElementById('passwordInput').value = '';
        document.getElementById('passwordInput').focus();
      }
    }

    document.getElementById('passwordInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') login();
    });

    if (sessionStorage.getItem('adminAuth') === 'true') {
      window.location.href = 'admin.html';
    }
  </script>
</body>
</html>
