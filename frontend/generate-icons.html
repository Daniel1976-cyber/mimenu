<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Generador de Iconos PWA</title>
  <style>
    body { font-family: sans-serif; background: #1e293b; color: #e2e8f0; display: flex; flex-direction: column; align-items: center; padding: 40px; }
    canvas { border: 1px solid #334155; border-radius: 12px; margin: 10px; }
    button { margin: 10px; padding: 10px 24px; background: #f59e0b; color: #0f172a; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    p { color: #64748b; margin-bottom: 20px; }
  </style>
</head>
<body>
  <h1>Generador de Iconos PWA</h1>
  <p>Haz click en cada boton para descargar el icono. Guarda en la carpeta /icons/</p>
  <div><canvas id="c192" width="192" height="192"></canvas><br><button onclick="download('c192','icon-192.png')">Descargar 192x192</button></div>
  <div><canvas id="c512" width="512" height="512"></canvas><br><button onclick="download('c512','icon-512.png')">Descargar 512x512</button></div>
  <script>
    function drawIcon(canvasId, size) {
      const c = document.getElementById(canvasId);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#0c0a09';
      ctx.fillRect(0, 0, size, size);
      ctx.fillStyle = '#fbbf24';
      ctx.font = `bold ${size * 0.35}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🍸', size/2, size/2 - size*0.08);
      ctx.font = `bold ${size * 0.13}px sans-serif`;
      ctx.fillText('MENU', size/2, size/2 + size*0.22);
    }
    drawIcon('c192', 192);
    drawIcon('c512', 512);
    function download(id, name) {
      const a = document.createElement('a');
      a.download = name;
      a.href = document.getElementById(id).toDataURL('image/png');
      a.click();
    }
  </script>
</body>
</html>
