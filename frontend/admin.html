<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Menu Bebidas</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 260px; background: #1e293b; border-right: 1px solid #334155; padding: 24px 16px; display: flex; flex-direction: column; z-index: 100; }
    .sidebar .logo { font-size: 1.5rem; font-weight: 700; color: #f59e0b; margin-bottom: 32px; padding: 0 8px; }
    .sidebar nav a { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: #94a3b8; text-decoration: none; border-radius: 10px; margin-bottom: 4px; transition: all .2s; font-size: .95rem; }
    .sidebar nav a:hover, .sidebar nav a.active { background: #334155; color: #f59e0b; }
    .sidebar nav a svg { width: 20px; height: 20px; fill: currentColor; flex-shrink: 0; }

    .main { margin-left: 260px; padding: 32px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
    .header h1 { font-size: 1.8rem; font-weight: 700; }
    .header .btn-add { padding: 10px 24px; background: #f59e0b; color: #0f172a; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: .95rem; transition: .2s; }
    .header .btn-add:hover { background: #d97706; }

    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 32px; }
    .stat-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px; }
    .stat-card .label { color: #64748b; font-size: .85rem; margin-bottom: 8px; }
    .stat-card .value { font-size: 2rem; font-weight: 700; }
    .stat-card .value.green { color: #22c55e; }
    .stat-card .value.red { color: #ef4444; }
    .stat-card .value.yellow { color: #f59e0b; }
    .stat-card .value.blue { color: #3b82f6; }

    .filters { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .filters input, .filters select { padding: 10px 16px; background: #1e293b; border: 1px solid #334155; border-radius: 10px; color: #e2e8f0; font-size: .9rem; font-family: inherit; }
    .filters input:focus, .filters select:focus { outline: none; border-color: #f59e0b; }
    .filters input { flex: 1; min-width: 200px; }
    .filters select { min-width: 160px; }

    .table-container { background: #1e293b; border: 1px solid #334155; border-radius: 16px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead th { background: #0f172a; padding: 14px 16px; text-align: left; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: #64748b; font-weight: 600; border-bottom: 1px solid #334155; }
    tbody td { padding: 14px 16px; border-bottom: 1px solid #1e293b; font-size: .9rem; }
    tbody tr { transition: .15s; }
    tbody tr:hover { background: #334155; }
    tbody tr:last-child td { border-bottom: none; }

    .badge { padding: 4px 10px; border-radius: 20px; font-size: .75rem; font-weight: 600; display: inline-block; }
    .badge.active { background: #052e16; color: #22c55e; }
    .badge.inactive { background: #450a0a; color: #ef4444; }
    .badge.stock-low { background: #451a03; color: #f59e0b; }

    .actions { display: flex; gap: 6px; }
    .btn-icon { width: 34px; height: 34px; border-radius: 8px; border: 1px solid #334155; background: transparent; color: #94a3b8; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: .2s; }
    .btn-icon:hover { background: #334155; color: #fff; }
    .btn-icon.toggle:hover { color: #f59e0b; border-color: #f59e0b; }
    .btn-icon.edit:hover { color: #3b82f6; border-color: #3b82f6; }
    .btn-icon.delete:hover { color: #ef4444; border-color: #ef4444; }
    .btn-icon svg { width: 16px; height: 16px; fill: currentColor; }

    .stock-input { width: 70px; padding: 6px 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; font-size: .85rem; text-align: center; font-family: inherit; }
    .stock-input:focus { outline: none; border-color: #f59e0b; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .modal-overlay.show { display: flex; }
    .modal { background: #1e293b; border: 1px solid #334155; border-radius: 20px; padding: 32px; width: 480px; max-width: 90vw; max-height: 90vh; overflow-y: auto; }
    .modal h2 { font-size: 1.3rem; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: .85rem; color: #94a3b8; margin-bottom: 6px; }
    .form-group input, .form-group select { width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-size: .9rem; font-family: inherit; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #f59e0b; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
    .btn-cancel { padding: 10px 20px; background: transparent; border: 1px solid #334155; border-radius: 8px; color: #94a3b8; cursor: pointer; font-family: inherit; font-size: .9rem; }
    .btn-cancel:hover { background: #334155; }
    .btn-save { padding: 10px 24px; background: #f59e0b; border: none; border-radius: 8px; color: #0f172a; font-weight: 600; cursor: pointer; font-family: inherit; font-size: .9rem; }
    .btn-save:hover { background: #d97706; }

    .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 24px; padding: 16px; }
    .pagination button { padding: 8px 14px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #94a3b8; cursor: pointer; font-family: inherit; transition: .2s; }
    .pagination button:hover { background: #334155; color: #fff; }
    .pagination button.active { background: #f59e0b; color: #0f172a; border-color: #f59e0b; font-weight: 600; }
    .pagination .info { padding: 8px 14px; color: #64748b; font-size: .85rem; }

    .toast { position: fixed; bottom: 24px; right: 24px; padding: 14px 24px; background: #22c55e; color: #fff; border-radius: 10px; font-weight: 500; transform: translateY(100px); opacity: 0; transition: .3s; z-index: 2000; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.error { background: #ef4444; }

    .loading { text-align: center; padding: 60px; color: #64748b; }

    @media (max-width: 768px) {
      .sidebar { width: 100%; height: auto; position: relative; flex-direction: row; overflow-x: auto; padding: 12px; }
      .sidebar .logo { margin-bottom: 0; margin-right: 16px; }
      .sidebar nav { display: flex; gap: 4px; }
      .sidebar nav a { padding: 8px 12px; white-space: nowrap; font-size: .8rem; }
      .main { margin-left: 0; padding: 16px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .header { flex-direction: column; gap: 16px; align-items: flex-start; }
      .filters { flex-direction: column; }
      .filters input, .filters select { min-width: auto; }
      .table-container { overflow-x: auto; }
      table { min-width: 700px; }
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="logo">Hotel Bar</div>
    <nav>
      <a href="#" class="active">
        <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
        Inventario
      </a>
      <a href="menu.html">
        <svg viewBox="0 0 24 24"><path d="M8.1 13.34l2.83-2.83L3.91 3.5c-1.56 1.56-1.56 4.09 0 5.66l4.19 4.18zm6.78-1.81c1.53.71 3.68.21 5.27-1.38 1.91-1.91 2.28-4.65.81-6.12-1.46-1.46-4.2-1.1-6.12.81-1.59 1.59-2.09 3.74-1.38 5.27L3.7 19.87l1.41 1.41L12 14.41l6.88 6.88 1.41-1.41L13.41 13l1.47-1.47z"/></svg>
        Menu Publico
      </a>
      <a href="#" onclick="logout()" style="margin-top:auto;color:#ef4444">
        <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        Cerrar Sesion
      </a>
    </nav>
  </div>

  <div class="main">
    <div class="header">
      <h1>Inventario de Bebidas</h1>
      <button class="btn-add" onclick="openAddModal()">+ Agregar Bebida</button>
    </div>

    <div class="stats" id="stats">
      <div class="stat-card"><div class="label">Total</div><div class="value yellow" id="statTotal">-</div></div>
      <div class="stat-card"><div class="label">Activas</div><div class="value green" id="statActive">-</div></div>
      <div class="stat-card"><div class="label">Inactivas</div><div class="value red" id="statInactive">-</div></div>
      <div class="stat-card"><div class="label">Sin Stock</div><div class="value blue" id="statOut">-</div></div>
    </div>

    <div class="filters">
      <input type="text" id="searchInput" placeholder="Buscar bebida..." oninput="loadBeverages()">
      <select id="filterCategory" onchange="loadBeverages()"><option value="">Todas las categorias</option></select>
      <select id="filterStatus" onchange="loadBeverages()">
        <option value="">Todos los estados</option>
        <option value="true">Activas</option>
        <option value="false">Inactivas</option>
      </select>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Categoria</th>
            <th>U/M</th>
            <th>Precio CUP</th>
            <th>Stock</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tableBody"><tr><td colspan="8" class="loading">Cargando...</td></tr></tbody>
      </table>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <h2 id="modalTitle">Agregar Bebida</h2>
      <input type="hidden" id="editId">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="formName" placeholder="Nombre de la bebida">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Categoria</label>
          <select id="formCategory">
            <option value="Agua">Agua</option><option value="Brandy">Brandy</option>
            <option value="Cerveza">Cerveza</option><option value="Crema">Crema</option>
            <option value="Elixir">Elixir</option><option value="Fruta">Fruta</option>
            <option value="Ginebra">Ginebra</option><option value="Helado">Helado</option>
            <option value="Jugo">Jugo</option><option value="Licor">Licor</option>
            <option value="Refresco">Refresco</option><option value="Ron">Ron</option>
            <option value="Tequila">Tequila</option><option value="Turrón">Turrón</option>
            <option value="Vermouth">Vermouth</option><option value="Vodka">Vodka</option>
            <option value="Whisky">Whisky</option>
          </select>
        </div>
        <div class="form-group">
          <label>Unidad de Medida</label>
          <select id="formUnit">
            <option value="45 ml">45 ml (Trago)</option>
            <option value="200 ml">200 ml</option>
            <option value="300 ml">300 ml</option>
            <option value="330 ml">330 ml</option>
            <option value="350 ml">350 ml</option>
            <option value="355 ml">355 ml</option>
            <option value="500 ml">500 ml</option>
            <option value="700 ml">700 ml</option>
            <option value="750 ml">750 ml</option>
            <option value="1000 ml">1000 ml</option>
            <option value="1500 ml">1500 ml</option>
            <option value="2000 ml">2000 ml</option>
            <option value="200 g">200 g</option>
            <option value="u">Unidad (u)</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Precio CUP</label>
          <input type="number" id="formPriceCUP" placeholder="0" min="0">
        </div>
        <div class="form-group">
          <label>Precio USD</label>
          <input type="number" id="formPriceUSD" placeholder="0" min="0" step="0.01">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Stock</label>
          <input type="number" id="formStock" placeholder="0" min="0">
        </div>
        <div class="form-group">
          <label>Estado</label>
          <select id="formActive">
            <option value="true">Activo</option>
            <option value="false">Inactivo</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
        <button class="btn-save" onclick="saveBeverage()">Guardar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    if (sessionStorage.getItem('adminAuth') !== 'true') {
      window.location.href = 'login.html';
    }

    const API = 'http://localhost:3000/api';
    let allBeverages = [];
    let currentPage = 1;
    const perPage = 25;

    async function loadStats() {
      try {
        const r = await fetch(`${API}/stats`);
        const s = await r.json();
        document.getElementById('statTotal').textContent = s.total;
        document.getElementById('statActive').textContent = s.active;
        document.getElementById('statInactive').textContent = s.inactive;
        document.getElementById('statOut').textContent = s.outOfStock;
      } catch (e) { console.error(e); }
    }

    async function loadCategories() {
      try {
        const r = await fetch(`${API}/categories`);
        const cats = await r.json();
        const sel = document.getElementById('filterCategory');
        cats.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); });
      } catch (e) { console.error(e); }
    }

    async function loadBeverages() {
      const search = document.getElementById('searchInput').value;
      const category = document.getElementById('filterCategory').value;
      const active = document.getElementById('filterStatus').value;
      let url = `${API}/beverages?`;
      if (search) url += `search=${encodeURIComponent(search)}&`;
      if (category) url += `category=${encodeURIComponent(category)}&`;
      if (active) url += `active=${active}&`;
      try {
        const r = await fetch(url);
        allBeverages = await r.json();
        currentPage = 1;
        renderTable();
      } catch (e) {
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="8" class="loading">Error al cargar datos</td></tr>';
      }
    }

    function renderTable() {
      const start = (currentPage - 1) * perPage;
      const page = allBeverages.slice(start, start + perPage);
      const tbody = document.getElementById('tableBody');
      if (page.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="loading">No se encontraron bebidas</td></tr>';
        document.getElementById('pagination').innerHTML = '';
        return;
      }
      tbody.innerHTML = page.map(b => `
        <tr>
          <td>${b.id}</td>
          <td style="max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${b.name}">${b.name}</td>
          <td><span class="badge active">${b.category}</span></td>
          <td>${b.unit}</td>
          <td>${b.priceCUP ? b.priceCUP.toLocaleString('es-CU') + ' $' : '-'}</td>
          <td><input class="stock-input" type="number" value="${b.stock}" min="0" onchange="updateStock(${b.id}, this.value)"></td>
          <td><span class="badge ${b.active ? 'active' : 'inactive'}">${b.active ? 'Activo' : 'Inactivo'}</span></td>
          <td class="actions">
            <button class="btn-icon toggle" title="Activar/Desactivar" onclick="toggleBeverage(${b.id})">
              <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            </button>
            <button class="btn-icon edit" title="Editar" onclick="editBeverage(${b.id})">
              <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            </button>
            <button class="btn-icon delete" title="Eliminar" onclick="deleteBeverage(${b.id}, '${b.name.replace(/'/g, "\\'")}')">
              <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            </button>
          </td>
        </tr>
      `).join('');

      const totalPages = Math.ceil(allBeverages.length / perPage);
      const pag = document.getElementById('pagination');
      if (totalPages <= 1) { pag.innerHTML = `<span class="info">${allBeverages.length} bebidas</span>`; return; }
      let html = `<span class="info">${allBeverages.length} bebidas</span>`;
      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
      }
      pag.innerHTML = html;
    }

    function goToPage(p) { currentPage = p; renderTable(); }

    async function toggleBeverage(id) {
      try {
        const r = await fetch(`${API}/beverages/${id}/toggle`, { method: 'PATCH' });
        const b = await r.json();
        showToast(b.active ? 'Bebida activada' : 'Bebida desactivada');
        loadStats(); loadBeverages();
      } catch (e) { showToast('Error al cambiar estado', true); }
    }

    async function updateStock(id, value) {
      try {
        await fetch(`${API}/beverages/${id}/stock`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ stock: parseInt(value) || 0 })
        });
        showToast('Stock actualizado');
        loadStats();
      } catch (e) { showToast('Error al actualizar stock', true); }
    }

    async function deleteBeverage(id, name) {
      if (!confirm(`Eliminar "${name}"?`)) return;
      try {
        await fetch(`${API}/beverages/${id}`, { method: 'DELETE' });
        showToast('Bebida eliminada');
        loadStats(); loadBeverages();
      } catch (e) { showToast('Error al eliminar', true); }
    }

    function openAddModal() {
      document.getElementById('modalTitle').textContent = 'Agregar Bebida';
      document.getElementById('editId').value = '';
      document.getElementById('formName').value = '';
      document.getElementById('formCategory').value = 'Agua';
      document.getElementById('formUnit').value = 'u';
      document.getElementById('formPriceCUP').value = '';
      document.getElementById('formPriceUSD').value = '';
      document.getElementById('formStock').value = '0';
      document.getElementById('formActive').value = 'true';
      document.getElementById('modalOverlay').classList.add('show');
    }

    function editBeverage(id) {
      const b = allBeverages.find(x => x.id === id);
      if (!b) return;
      document.getElementById('modalTitle').textContent = 'Editar Bebida';
      document.getElementById('editId').value = b.id;
      document.getElementById('formName').value = b.name;
      document.getElementById('formCategory').value = b.category;
      document.getElementById('formUnit').value = b.unit;
      document.getElementById('formPriceCUP').value = b.priceCUP || '';
      document.getElementById('formPriceUSD').value = b.priceUSD || '';
      document.getElementById('formStock').value = b.stock;
      document.getElementById('formActive').value = b.active.toString();
      document.getElementById('modalOverlay').classList.add('show');
    }

    function closeModal(e) {
      if (!e || e.target === document.getElementById('modalOverlay')) {
        document.getElementById('modalOverlay').classList.remove('show');
      }
    }

    async function saveBeverage() {
      const id = document.getElementById('editId').value;
      const data = {
        name: document.getElementById('formName').value.trim(),
        category: document.getElementById('formCategory').value,
        unit: document.getElementById('formUnit').value,
        priceCUP: parseFloat(document.getElementById('formPriceCUP').value) || 0,
        priceUSD: parseFloat(document.getElementById('formPriceUSD').value) || null,
        stock: parseInt(document.getElementById('formStock').value) || 0,
        active: document.getElementById('formActive').value === 'true'
      };
      if (!data.name) { showToast('El nombre es obligatorio', true); return; }
      try {
        const method = id ? 'PUT' : 'POST';
        const url = id ? `${API}/beverages/${id}` : `${API}/beverages`;
        await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        showToast(id ? 'Bebida actualizada' : 'Bebida agregada');
        closeModal();
        loadStats(); loadBeverages();
      } catch (e) { showToast('Error al guardar', true); }
    }

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => t.className = 'toast', 2500);
    }

    loadStats(); loadCategories(); loadBeverages();

    function logout() {
      sessionStorage.removeItem('adminAuth');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
